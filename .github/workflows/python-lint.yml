name: python-lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: ruff 설치
        run: pip install --quiet ruff

      - name: 구문 오류·미정의 이름 검사
        # CI 러너에는 rclpy/mavros_msgs 가 없으므로 임포트 해석이 필요한
        # 규칙은 돌릴 수 없다. 구문 오류(E9)와 미정의 이름(F82) 등
        # 정적으로 판정 가능한 것만 검사한다.
        run: ruff check --select E9,F63,F7,F82 tools/

      - name: 바이트컴파일 확인
        run: python -m compileall -q tools/
